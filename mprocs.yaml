procs:
  mobile:
    cwd: <CONFIG_DIR>/holi-frontends
    env:
      HOLI_API_URL: https://staging.unified.apis.holi.social/graphql
    shell: >
      yarn mobile:dev
  web:
    cwd: <CONFIG_DIR>/holi-frontends
    env:
      HOLI_API_URL: https://staging.unified.apis.holi.social/graphql
      SENTRY_IGNORE_API_RESOLUTION_ERROR: "1"
    shell: >
      yarn web:dev
  storybook:
    cwd: <CONFIG_DIR>/holi-frontends
    shell: >
      yarn storybook:dev --no-open

