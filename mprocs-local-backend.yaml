procs:
  mobile:
    cwd: <CONFIG_DIR>/holi-frontends
    env:
      HOLI_API_URL: http://localhost:4455/graphql
    shell: >
      yarn mobile:dev
  web:
    cwd: <CONFIG_DIR>/holi-frontends
    env:
      HOLI_API_URL: http://localhost:4455/graphql
      SENTRY_IGNORE_API_RESOLUTION_ERROR: "1"
    shell: >
      yarn web:dev
  storybook:
    cwd: <CONFIG_DIR>/holi-frontends
    shell: yarn storybook:dev --no-open
  adb reverse:
    shell: >
      adb reverse tcp:4455 tcp:4455 && echo 'Android should now be able to communicate with oathkeeper / unified api'
  oathkeeper:
    cwd: <CONFIG_DIR>/holi-unified-api/oathkeeper
    shell: >
      docker run --rm --name ory-oathkeeper-unified-api -p 4455:4455 -p 4456:4456
      --env-file=.env.local --mount type=bind,source=$PWD,target=/opt/oathkeeper/
      --add-host=host.docker.internal:host-gateway oryd/oathkeeper:v0.39.4 --config
      /opt/oathkeeper/config.yaml serve
  unified-api:
    cwd: <CONFIG_DIR>/holi-unified-api
    shell: >
      ../wait-for-port.sh 8000; ../wait-for-port.sh 8001; ../wait-for-port.sh 8002;
      ../wait-for-port.sh 8003; ../wait-for-port.sh 8004; yarn dev
  okuna-services:
    cwd: <CONFIG_DIR>/holi-okuna
    shell: >
      pip3 install -r requirements-cli-only.txt; python3 okuna-cli.py up-services-only
  okuna-server:
    cwd: <CONFIG_DIR>/holi-okuna
    # Before starting the server process, the services need to be up. Therefore, we wait until the services are up via a small until loop.
    shell: >
      echo "waiting for services"; until docker ps|grep okuna-redis; 
      do sleep 1; echo -n .; done; . .venv/bin/activate; pip3 install -r requirements.txt;
      . ./.envrc.local;
      python3 manage.py migrate; python3 start_server.py --reload
      || echo 'maybe you need to execute "python manage.py migrate" again?'
  donations-api:
    cwd: <CONFIG_DIR>/holi-app-donations
    shell: >
      vr install && vr dev
  geo-api:
    cwd: <CONFIG_DIR>/holi-geo-api
    shell: >
      . ./.envrc.local && vr install && vr dev
  goodnews-api:
    cwd: <CONFIG_DIR>/holi-app-goodnews
    shell: >
      . ./.envrc.local && vr install && vr dev
  volunteering-api:
    cwd: <CONFIG_DIR>/holi-app-volunteering
    shell: >
      . ./.envrc.local && vr install && vr dev

