procs:
  "holi-dev.sh start":
    cwd: <CONFIG_DIR>/..
    stop:
      send-keys:
        - <C-c>
        - <C-c>
    shell: |
      ./compose/compose-rebuild-check.sh

      trap '$COMPOSE_CMD_BASE down' EXIT

      $COMPOSE_CMD_BASE up --watch
  "└─ app-donations":
    cwd: <CONFIG_DIR>/..
    autorestart: true
    shell: >
      ./holi-dev.sh logs -f app-donations
  "└─ app-goodnews":
