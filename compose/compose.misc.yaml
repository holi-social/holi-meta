
services:
  libretranslate:
    container_name: libretranslate
    build:
      context: ./holi-libretranslate
      dockerfile: Dockerfile
      args:
        lang_codes: en,de
    environment:
      LT_HOST: 0.0.0.0
      LT_PORT: ${LIBRETRANSLATE_INTERNAL_PORT}
    ports:
      - ${LIBRETRANSLATE_PORT}:${LIBRETRANSLATE_INTERNAL_PORT}
    healthcheck:
      test: ["CMD-SHELL", "/app/venv/bin/python /app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - holi-local

  frontend-storybook:
    container_name: frontend-storybook
    # Uses the same image as web, but runs storybook instead
    image: holi-dev-frontend-web:latest
    entrypoint: ["/entrypoint.sh"]
    command: ["yarn", "holi-bricks:web", "--no-open"]
    environment:
      PORT: ${FRONTEND_STORYBOOK_PORT}
    volumes:
      - ./compose/healthcheck-via:/usr/local/bin/healthcheck-via:ro
      - ./compose/frontends/entrypoint.sh:/entrypoint.sh:ro
      - ./holi-frontends/holi-bricks:/app/holi-bricks:delegated
    ports:
      - ${FRONTEND_STORYBOOK_PORT}:${FRONTEND_STORYBOOK_PORT}
    develop:
      watch:
        - action: sync
          path: ./holi-frontends/holi-bricks
          target: /app/holi-bricks
        - action: sync+restart
          path: ./holi-frontends/.envrc.local
          target: /app/.envrc.local
    healthcheck:
      test: ["CMD-SHELL", "healthcheck-via node-http http://127.0.0.1:${FRONTEND_STORYBOOK_PORT}"]
      interval: 30s 
      timeout: 10s
      start_period: 30s
      retries: 5
    networks:
      - holi-local