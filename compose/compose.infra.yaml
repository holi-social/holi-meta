# Contains infrastructure resources for docker compose setup

networks:
  holi-local:
    driver: bridge
    name: holi-local
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET}

volumes:
  pg_data:
    name: holi-dev_pg_data
    driver: local
  redis_data:
    name: holi-dev_redis_data
    driver: local

