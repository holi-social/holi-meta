---
procs:
  mobile:
    shell: >
      yarn mobile:dev
    env:
      HOLI_API_URL: "https://production.unified.apis.project-holi.org/graphql"
      KRATOS_BASE_URL: "https://auth.project-holi.org"
    cwd: "<CONFIG_DIR>/holi-frontends"
  web:
    shell: >
      yarn web:dev
    env:
      HOLI_API_URL: "https://production.unified.apis.project-holi.org/graphql"
    cwd: "<CONFIG_DIR>/holi-frontends"
  storybook:
    shell: >
      yarn storybook:dev --no-open
    cwd: "<CONFIG_DIR>/holi-frontends"
