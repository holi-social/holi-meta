procs:
  adb reverse:
    shell: adb reverse tcp:4455 tcp:4455 && echo 'Android should not be able to communicate
      with oathkeeper / unified api'
  donations-api:
    cwd: <CONFIG_DIR>/holi-app-donations
    shell: vr install && vr dev
  geo-api:
    cwd: <CONFIG_DIR>/holi-geo-api
    shell: . ./.envrc.local && vr install && vr dev
  goodnews-api:
    cwd: <CONFIG_DIR>/holi-app-goodnews
    shell: . ./.envrc.local && vr install && vr dev
  mobile:
    cwd: <CONFIG_DIR>/holi-frontends
    env:
      HOLI_API_URL: http://localhost:4455/graphql
    shell: yarn mobile:dev
  oathkeeper:
    cwd: <CONFIG_DIR>/holi-unified-api/oathkeeper
    shell: docker run --rm --name ory-oathkeeper-unified-api -p 4455:4455 -p 4456:4456
      --env-file=.env.local --mount type=bind,source=$PWD,target=/opt/oathkeeper/
      --add-host=host.docker.internal:host-gateway oryd/oathkeeper:v0.39.4 --config
      /opt/oathkeeper/config.yaml serve
  okuna-server:
    comment: Before starting the server process, the services need to be up. Therefore,
      we wait until the services are up via a small until loop.
    cwd: <CONFIG_DIR>/holi-okuna
    shell: until docker ps|grep okuna-worker; do sleep 1; done; . .venv/bin/activate;
      pip3 install -r requirements.txt; python3 manage.py migrate; python3 start_server.py
      || echo 'maybe you need to execute "python manage.py migrate" again?'
  okuna-services:
    cwd: <CONFIG_DIR>/holi-okuna
    shell: pip3 install -r requirements-cli-only.txt; python3 okuna-cli.py up-services-only
  storybook:
    cwd: <CONFIG_DIR>/holi-frontends
    shell: yarn storybook:dev --no-open
  unified-api:
    cwd: <CONFIG_DIR>/holi-unified-api
    shell: ../wait-for-port.sh 8000; ../wait-for-port.sh 8001; ../wait-for-port.sh
      8002; ../wait-for-port.sh 8003; ../wait-for-port.sh 8004; yarn dev
  volunteering-api:
    cwd: <CONFIG_DIR>/holi-app-volunteering
    shell: . ./.envrc.local && vr install && vr dev
  web:
    cwd: <CONFIG_DIR>/holi-frontends
    env:
      HOLI_API_URL: http://localhost:4455/graphql
    shell: yarn web:dev

